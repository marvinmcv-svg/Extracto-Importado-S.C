<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda — 156 equivalencias de perfumes · Extracto Importado</title>
  <meta name="description" content="Catálogo completo de Extracto Importado: 156 equivalencias de perfumes para ella, para él y unisex. Filtrá por familia olfativa y marca. 100 ml a 350 Bs." />
  <meta name="theme-color" content="#f2ece3" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-page="tienda">
  <main id="main">
    <header class="phead wrap">
      <div>
        <nav class="crumbs" aria-label="Ruta"><a href="/">Inicio</a><span>Tienda</span></nav>
        <h1 class="display" id="shopTitle" data-split>La <i>colección.</i></h1>
        <p class="lead" data-reveal>Buscá por el nombre del perfume original. Cada foto muestra el original junto a nuestra versión y sus acordes principales.</p>
      </div>
      <p class="phead__meta"><strong id="shopTotal">156</strong>fragancias</p>
    </header>

    <section class="shop wrap">
      <aside class="filters" id="filters" aria-label="Filtros" data-lenis-prevent>
        <div class="filters__close"><span>Filtros</span><button class="icon-btn" id="filtersClose" aria-label="Cerrar filtros">✕</button></div>
        <div class="fgroup"><h3>Línea</h3><div id="fLine"></div></div>
        <div class="fgroup"><h3>Familia olfativa</h3><div id="fFam"></div></div>
        <div class="fgroup"><h3>Casa de referencia</h3><div id="fHouse"></div><button class="fmore" id="houseMore">Ver todas</button></div>
        <button class="freset" id="fReset">Limpiar filtros</button>
      </aside>

      <div class="shop__main">
        <div class="toolbar">
          <label class="field-search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm5.3-2.2L21 21"/></svg>
            <span class="sr-only">Buscar en la tienda</span>
            <input id="q" type="search" placeholder="Buscar perfume o marca" autocomplete="off" />
          </label>
          <button class="btn btn--line btn--sm ftoggle" id="filtersOpen">Filtros</button>
          <label><span class="sr-only">Ordenar</span>
            <select id="sort">
              <option value="catalog">Orden del catálogo</option>
              <option value="popular">Más pedidos primero</option>
              <option value="az">Nombre A–Z</option>
              <option value="house">Por casa</option>
            </select>
          </label>
        </div>
        <div class="active-filters" id="active"></div>
        <p class="toolbar__count" id="count" aria-live="polite"></p>
        <div class="grid" id="grid"></div>
        <div class="shop__more"><button class="btn btn--line" id="more">Ver más</button></div>
      </div>
    </section>
  </main>
  <script type="module" src="/src/pages/shop.js"></script>
</body>
</html>
